name: Devops_Niranjan_CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # Disable automatic npm caching if not required
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
           name: niranjan-artifact
           path: dist/
           compression-level: 9 
      